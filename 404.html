<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awadhinfosolution</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Redirect all 404s to index.html for SPA routing
      var redirectTo = '/index.html';
      var l = window.location;
      if (l.pathname !== '/' && !l.pathname.endsWith('/index.html')) {
        window.location.replace(redirectTo + l.search + l.hash);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
